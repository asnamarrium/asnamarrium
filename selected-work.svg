<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760">
    <stop offset="0" stop-color="#080B16"/>
    <stop offset="0.55" stop-color="#0B1020"/>
    <stop offset="1" stop-color="#101126"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8B5CF6"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#11182B"/>
    <stop offset="1" stop-color="#0D1324"/>
  </linearGradient>
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .kicker{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;letter-spacing:4px;fill:#94A3B8}
    .title{font-family:Arial,Helvetica,sans-serif;font-size:38px;font-weight:800;letter-spacing:1px;fill:#F8FAFC}
    .num{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:800;fill:#A78BFA}
    .proj{font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:800;fill:#F8FAFC}
    .desc{font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:500;fill:#CBD5E1}
    .tag{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;fill:#A5F3FC}
    .metric{font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:800;fill:#F8FAFC}
    .metricLabel{font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;letter-spacing:1.2px;fill:#94A3B8}
  </style>
</defs>

<rect width="1200" height="760" fill="url(#bg)"/>

<!-- ambient glow -->
<circle cx="1040" cy="90" r="120" fill="#7C3AED" opacity=".10" filter="url(#glow)"/>
<circle cx="180" cy="680" r="120" fill="#22D3EE" opacity=".07" filter="url(#glow)"/>

<!-- header -->
<text x="80" y="82" class="kicker">AI ENGINEERING PORTFOLIO</text>
<text x="80" y="138" class="title">SELECTED WORK</text>
<rect x="80" y="164" width="1040" height="2" rx="1" fill="url(#accent)" opacity=".9"/>

<!-- card 1 -->
<rect x="80" y="205" width="1040" height="130" rx="18" fill="url(#card)" stroke="#2A3550"/>
<rect x="80" y="205" width="5" height="130" rx="2.5" fill="#8B5CF6"/>
<text x="112" y="240" class="num">01</text>
<text x="170" y="240" class="proj">AUTOMATED VIDEO SEO</text>
<text x="170" y="270" class="desc">Multi-Model AI System for Automated Video SEO</text>
<text x="170" y="306" class="tag">LLMs  ·  LangChain  ·  Groq  ·  Streamlit</text>

<!-- card 2 -->
<rect x="80" y="360" width="1040" height="130" rx="18" fill="url(#card)" stroke="#2A3550"/>
<rect x="80" y="360" width="5" height="130" rx="2.5" fill="#22D3EE"/>
<text x="112" y="395" class="num">02</text>
<text x="170" y="395" class="proj">CROPINSIGHT AI</text>
<text x="170" y="425" class="desc">Computer Vision for Crop Disease Detection</text>
<text x="170" y="461" class="tag">TensorFlow  ·  FastAPI  ·  Docker  ·  Computer Vision</text>
<text x="1005" y="417" text-anchor="middle" class="metric">94%</text>
<text x="1005" y="441" text-anchor="middle" class="metricLabel">CLASSIFICATION ACCURACY</text>

<!-- card 3 -->
<rect x="80" y="515" width="1040" height="150" rx="18" fill="url(#card)" stroke="#2A3550"/>
<rect x="80" y="515" width="5" height="150" rx="2.5" fill="#A78BFA"/>
<text x="112" y="550" class="num">03</text>
<text x="170" y="550" class="proj">GEMNet</text>
<text x="170" y="580" class="desc">Graph-Enhanced Monotonic Neural Networks</text>
<text x="170" y="616" class="tag">Graph Learning  ·  Monotonic Constraints  ·  Deep Learning</text>
<text x="910" y="575" text-anchor="middle" class="metric">R² 0.914</text>
<text x="910" y="599" text-anchor="middle" class="metricLabel">MODEL PERFORMANCE</text>
<text x="1045" y="575" text-anchor="middle" class="metric">94.7%</text>
<text x="1045" y="599" text-anchor="middle" class="metricLabel">MONOTONICITY</text>

<!-- footer accent -->
<text x="80" y="715" class="kicker">RESEARCH  ·  BUILD  ·  DEPLOY</text>
<circle cx="1090" cy="708" r="5" fill="#8B5CF6"/>
<circle cx="1110" cy="708" r="5" fill="#22D3EE"/>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="520">
    <stop offset="0%" stop-color="#080B16"/>
    <stop offset="55%" stop-color="#0D1020"/>
    <stop offset="100%" stop-color="#08131C"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8B5CF6"/>
    <stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1400" height="520" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="518" rx="23" fill="none" stroke="#334155" stroke-opacity=".65"/>

<!-- header -->
<text x="70" y="85" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="2">ENGINEERING WORKFLOW</text>
<text x="70" y="122" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="17">From experimentation to production-ready AI systems</text>
<rect x="70" y="148" width="180" height="3" rx="2" fill="url(#accent)" filter="url(#glow)"/>

<!-- workflow line -->
<line x1="155" y1="290" x2="1245" y2="290" stroke="#334155" stroke-width="2"/>
<line x1="155" y1="290" x2="1245" y2="290" stroke="url(#accent)" stroke-width="2" stroke-opacity=".75"/>

<!-- nodes -->
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
  <g transform="translate(155 290)">
    <circle r="42" fill="#101326" stroke="#8B5CF6" stroke-width="2"/>
    <text y="6" fill="#C4B5FD" font-size="14" font-weight="700">01</text>
    <text y="76" fill="#F8FAFC" font-size="17" font-weight="700">DATA</text>
    <text y="101" fill="#94A3B8" font-size="12">Collect · Prepare</text>
  </g>
  <g transform="translate(335 290)">
    <circle r="42" fill="#101326" stroke="#8B5CF6" stroke-width="2"/>
    <text y="6" fill="#C4B5FD" font-size="14" font-weight="700">02</text>
    <text y="76" fill="#F8FAFC" font-size="17" font-weight="700">EXPERIMENT</text>
    <text y="101" fill="#94A3B8" font-size="12">Explore · Iterate</text>
  </g>
  <g transform="translate(515 290)">
    <circle r="42" fill="#101326" stroke="#818CF8" stroke-width="2"/>
    <text y="6" fill="#C4B5FD" font-size="14" font-weight="700">03</text>
    <text y="76" fill="#F8FAFC" font-size="17" font-weight="700">TRAIN</text>
    <text y="101" fill="#94A3B8" font-size="12">Build · Optimize</text>
  </g>
  <g transform="translate(695 290)">
    <circle r="42" fill="#101326" stroke="#818CF8" stroke-width="2"/>
    <text y="6" fill="#C4B5FD" font-size="14" font-weight="700">04</text>
    <text y="76" fill="#F8FAFC" font-size="17" font-weight="700">EVALUATE</text>
    <text y="101" fill="#94A3B8" font-size="12">Measure · Validate</text>
  </g>
  <g transform="translate(875 290)">
    <circle r="42" fill="#101326" stroke="#22D3EE" stroke-width="2"/>
    <text y="6" fill="#A5F3FC" font-size="14" font-weight="700">05</text>
    <text y="76" fill="#F8FAFC" font-size="17" font-weight="700">TRACK</text>
    <text y="101" fill="#94A3B8" font-size="12">Version · Monitor</text>
  </g>
  <g transform="translate(1055 290)">
    <circle r="42" fill="#101326" stroke="#22D3EE" stroke-width="2"/>
    <text y="6" fill="#A5F3FC" font-size="14" font-weight="700">06</text>
    <text y="76" fill="#F8FAFC" font-size="17" font-weight="700">API</text>
    <text y="101" fill="#94A3B8" font-size="12">Serve · Integrate</text>
  </g>
  <g transform="translate(1235 290)">
    <circle r="42" fill="#101326" stroke="#22D3EE" stroke-width="2"/>
    <text y="6" fill="#A5F3FC" font-size="14" font-weight="700">07</text>
    <text y="76" fill="#F8FAFC" font-size="17" font-weight="700">DEPLOY</text>
    <text y="101" fill="#94A3B8" font-size="12">Containerize · Ship</text>
  </g>
</g>

<!-- tool strip -->
<rect x="70" y="432" width="1260" height="48" rx="12" fill="#0B1020" stroke="#1E293B"/>
<text x="700" y="463" text-anchor="middle" fill="#CBD5E1" font-family="JetBrains Mono,monospace" font-size="15">
Python   ·   Scikit-learn   ·   TensorFlow   ·   PyTorch   ·   MLflow   ·   DVC   ·   FastAPI   ·   Docker
</text>
</svg>
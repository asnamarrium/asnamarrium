<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="260" viewBox="0 0 1400 260">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="260">
    <stop offset="0%" stop-color="#080B16"/><stop offset="55%" stop-color="#0D1020"/><stop offset="100%" stop-color="#08131C"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
    <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1400" height="260" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="258" rx="21" fill="none" stroke="#334155" stroke-opacity=".65"/>

<text x="700" y="85" text-anchor="middle" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="5">ASNA MARRIUM · AI ENGINEER</text>

<text x="700" y="143" text-anchor="middle" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="1">BUILDING INTELLIGENT SYSTEMS</text>

<rect x="500" y="168" width="400" height="3" rx="2" fill="url(#accent)" filter="url(#glow)"/>

<text x="700" y="215" text-anchor="middle" fill="#A5B4FC" font-family="Inter,Arial,sans-serif" font-size="16">
Machine Learning   ·   Agentic AI   ·   Computer Vision   ·   MLOps
</text>
</svg>
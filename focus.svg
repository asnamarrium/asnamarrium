<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="620">
    <stop offset="0%" stop-color="#080B16"/><stop offset="55%" stop-color="#0D1020"/><stop offset="100%" stop-color="#08131C"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#22D3EE"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1400" height="620" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="618" rx="23" fill="none" stroke="#334155" stroke-opacity=".7"/>

<text x="70" y="88" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="700" letter-spacing="2">AI ENGINEERING FOCUS</text>
<text x="70" y="126" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="17">Core domains shaping my work in intelligent systems</text>
<rect x="70" y="151" width="195" height="3" rx="2" fill="url(#accent)" filter="url(#glow)"/>

<!-- cards -->
<g font-family="Inter,Arial,sans-serif">

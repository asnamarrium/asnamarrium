  <text x="105" y="286" fill="#F8FAFC" font-size="27" font-weight="700">MACHINE LEARNING</text>
  <text x="105" y="322" fill="#94A3B8" font-size="16">Deep Learning  ·  Model Development  ·  Predictive Systems</text>


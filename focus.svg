  <text x="765" y="432" fill="#C4B5FD" font-size="14" font-weight="700" letter-spacing="2">04</text>
  <text x="765" y="471" fill="#F8FAFC" font-size="27" font-weight="700">MLOPS</text>
  <text x="765" y="507" fill="#94A3B8" font-size="16">Experiment Tracking  ·  APIs  ·  Docker  ·  Deployment</text>

  <rect x="70" y="390" width="600" height="145" rx="16" fill="#0B1020" stroke="#22D3EE" stroke-opacity=".55"/>
  <text x="105" y="432" fill="#67E8F9" font-size="14" font-weight="700" letter-spacing="2">03</text>
  <text x="105" y="471" fill="#F8FAFC" font-size="27" font-weight="700">COMPUTER VISION</text>

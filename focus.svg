  <text x="765" y="286" fill="#F8FAFC" font-size="27" font-weight="700">AGENTIC AI</text>
  <text x="765" y="322" fill="#94A3B8" font-size="16">LLMs  ·  RAG  ·  AI Agents  ·  Intelligent Workflows</text>


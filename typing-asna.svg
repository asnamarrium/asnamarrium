<svg width="850" height="50" viewBox="0 0 850 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&amp;display=swap');

      .term-bg {
        fill: #0c0a15;
        stroke: #7c3aed;
        stroke-opacity: 0.6;
        stroke-width: 1;
      }

      .prompt {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        font-size: 15px;
        fill: #a855f7;
      }

      .text-base {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        font-size: 14px;
        fill: url(#textGrad);
      }

      .cursor {
        fill: #38bdf8;
        animation: blink 0.7s infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <clipPath id="clip">
      <rect x="0" y="0" width="0" height="50">
        <animate
          attributeName="width"
          values="0; 560; 560; 0; 0; 560; 560; 0"
          keyTimes="0; 0.35; 0.50; 0.55; 0.60; 0.85; 0.95; 1"
          dur="10s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>
  </defs>

  <!-- Terminal window -->
  <rect width="850" height="50" rx="10" class="term-bg"/>

  <!-- Terminal controls -->
  <circle cx="25" cy="25" r="4" fill="#ef4444"/>
  <circle cx="37" cy="25" r="4" fill="#f59e0b"/>
  <circle cx="49" cy="25" r="4" fill="#10b981"/>

  <!-- Asna's terminal prompt -->
  <text x="68" y="31" class="prompt">asna@ai-engineer:~$</text>

  <!-- Typing line -->
  <g transform="translate(250, 0)">
    <g clip-path="url(#clip)">
      <text y="31" class="text-base">
        AI Engineer • Machine Learning • Agentic AI • Computer Vision • MLOps
      </text>
    </g>
  </g>

  <!-- Typing cursor -->
  <rect y="16" width="10" height="18" class="cursor" rx="2">
    <animate
      attributeName="x"
      values="252; 810; 810; 252; 252; 810; 810; 252"
      keyTimes="0; 0.35; 0.50; 0.55; 0.60; 0.85; 0.95; 1"
      dur="10s"
      repeatCount="indefinite"
    />
  </rect>
</svg>
